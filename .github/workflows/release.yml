name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Verify release version"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import json, os
          version = json.load(open("custom_components/eversolo/manifest.json"))["version"]
          assert version == os.environ["RELEASE_TAG"].removeprefix("v"), "Release tag must match manifest version"
          PYTHON

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/eversolo"
          zip eversolo.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: ${{ github.workspace }}/custom_components/eversolo/eversolo.zip
